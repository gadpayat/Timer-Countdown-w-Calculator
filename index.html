<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKB-CDD Dashboard</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
color:white;
background:radial-gradient(circle at center,#1a0000 0%,#000 70%);
overflow-x:hidden;
}
body::before{
content:"";
position:fixed;
top:-50%;left:-50%;
width:200%;height:200%;
background:conic-gradient(from 0deg,rgba(255,0,0,.15),rgba(0,0,0,.8),rgba(255,0,0,.1),rgba(0,0,0,.9));
animation:spin 6s linear infinite;
filter:blur(40px);
z-index:-2;
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.container{max-width:1200px;margin:auto;padding:20px;text-align:center}
#countdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.time-box{background:#200;padding:15px;border-radius:10px;min-width:100px}
.number{font-size:2rem;font-weight:bold}

.nav-btn{
background:#b00000;color:#fff;border:none;padding:12px 20px;
border-radius:8px;cursor:pointer;margin-top:15px;
}

.tools-container{
display:flex;
gap:30px;
justify-content:center;
align-items:flex-start;
margin-top:30px;
flex-wrap:wrap;
}

.panel{
width:500px;
background:rgba(20,0,0,.9);
padding:15px;
border-radius:12px;
border:1px solid rgba(255,0,0,.3);
}

#calcDisplay,input,select{
width:100%;
height:45px;
margin-bottom:10px;
box-sizing:border-box;
background:#000;
color:#ff6666;
border:none;
border-radius:8px;
padding:8px;
}

.calc-buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

button{
background:#b00000;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
padding:10px;
}

.calc-buttons button{height:50px}

footer{
text-align:center;
padding:15px;
font-size:12px;
color:#ff9999;
}

@media(max-width:1100px){
.panel{width:95%}
.tools-container{flex-direction:column;align-items:center}
}
</style>
</head>
<body>

<div class="container">

<h1>SP Completion Countdown for KKB-CDD</h1>

<div id="countdown">
<div class="time-box"><div class="number" id="days">0</div><div>Days</div></div>
<div class="time-box"><div class="number" id="hours">0</div><div>Hours</div></div>
<div class="time-box"><div class="number" id="minutes">0</div><div>Minutes</div></div>
<div class="time-box"><div class="number" id="seconds">0</div><div>Seconds</div></div>
</div>

<p>
<button class="nav-btn" onclick="window.open('https://gadpayat.github.io/Status-Countdown/','_blank')">
View Individual SP Countdown
</button>
</p>

<div class="tools-container">

<div class="panel">
<h2>Scientific Calculator</h2>
<input id="calcDisplay" readonly>

<div class="calc-buttons">
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>
<button onclick="add('**')">xʸ</button>
<button onclick="clr()">C</button>

<button onclick="add('Math.sin(')">sin</button>
<button onclick="add('Math.cos(')">cos</button>
<button onclick="add('Math.tan(')">tan</button>
<button onclick="add('/')">÷</button>

<button onclick="add('Math.log10(')">log</button>
<button onclick="add('Math.sqrt(')">√</button>
<button onclick="add('*')">×</button>
<button onclick="add('-')">−</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('+')">+</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="eq()">=</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="bk()">⌫</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('Math.PI')">π</button>
<button onclick="add('Math.E')">e</button>
</div>
</div>

<div class="panel">
<h2>Universal Unit Converter</h2>

<select id="category" onchange="populateUnits()">
<option value="length">Length</option>
<option value="mass">Mass</option>
<option value="temperature">Temperature</option>
<option value="speed">Speed</option>
<option value="time">Time</option>
</select>

<input type="number" id="unitInput" placeholder="Enter Value">
<select id="fromUnit"></select>
<select id="toUnit"></select>

<button onclick="convertUnit()">Convert</button>

<input id="unitResult" readonly placeholder="Result">

</div>

</div>
</div>

<footer>© 2026 Ghilous. All Rights Reserved.</footer>

<script>
const targetDate=new Date("October 31, 2026 00:00:00").getTime();

setInterval(()=>{
let d=targetDate-Date.now();
if(d<0)return;
days.textContent=Math.floor(d/86400000);
hours.textContent=Math.floor((d%86400000)/3600000);
minutes.textContent=Math.floor((d%3600000)/60000);
seconds.textContent=Math.floor((d%60000)/1000);
},1000);

function add(v){calcDisplay.value+=v;}
function clr(){calcDisplay.value='';}
function bk(){calcDisplay.value=calcDisplay.value.slice(0,-1);}
function eq(){try{calcDisplay.value=eval(calcDisplay.value);}catch(e){calcDisplay.value='Error';}}

const units={
length:{mm:0.001,cm:0.01,m:1,km:1000,ft:0.3048,mi:1609.344},
mass:{g:0.001,kg:1,lb:0.453592,ton:1000},
speed:{"m/s":1,"km/h":0.277778,mph:0.44704},
time:{sec:1,min:60,hr:3600,day:86400},
temperature:{C:1,F:1,K:1}
};

function populateUnits(){
const cat=category.value;
fromUnit.innerHTML='';
toUnit.innerHTML='';
Object.keys(units[cat]).forEach(u=>{
fromUnit.add(new Option(u,u));
toUnit.add(new Option(u,u));
});
}

function convertUnit(){
let cat=category.value;
let value=parseFloat(unitInput.value);
if(isNaN(value)) return;

if(cat==='temperature'){
let f=fromUnit.value,t=toUnit.value,r=value;
if(f==='C'&&t==='F')r=value*9/5+32;
else if(f==='F'&&t==='C')r=(value-32)*5/9;
else if(f==='C'&&t==='K')r=value+273.15;
else if(f==='K'&&t==='C')r=value-273.15;
unitResult.value=r;
return;
}

let base=value*units[cat][fromUnit.value];
unitResult.value=base/units[cat][toUnit.value];
}

populateUnits();
</script>
</body>
</html>
