<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
}

/* 3D Background Canvas */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* Main Container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:1000;
    width:100%;
}

h1{
    font-size:1.6rem;
    margin-bottom:15px;
    text-shadow:0 0 20px white;
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:12px;
    min-width:90px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 20px rgba(255,255,255,0.15);
}

.number{
    font-size:2rem;
    font-weight:bold;
}

.label{
    font-size:0.8rem;
    color:#ddd;
    margin-top:5px;
}

/* Button */

.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 0 20px red;
    transition:.3s;
}

.nav-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px red;
}

/* Calculator */

.calculator-container{
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.calculator{
    width:330px;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(15px);
    border-radius:15px;
    padding:15px;
    box-shadow:0 0 25px rgba(255,255,255,0.2);
}

.calc-display{
    width:100%;
    height:60px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    padding:10px;
    font-size:22px;
    text-align:right;
    background:#111;
    color:#00ff00;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.calc-buttons button{
    height:45px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.calc-buttons button:hover{
    background:#444;
}

/* Footer */

footer{
    position:fixed;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:10px;
    color:rgba(255,255,255,0.8);
    z-index:1000;
}

@media(max-width:768px){

    #countdown{
        flex-wrap:wrap;
    }

    .calculator{
        width:95%;
    }

    h1{
        font-size:1.2rem;
    }

}

</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">

<h1>Sub-Project Completion Countdown for KKB-CDD</h1>

<div id="countdown">

<div class="time-box">
<div class="number" id="days">0</div>
<div class="label">Days</div>
</div>

<div class="time-box">
<div class="number" id="hours">0</div>
<div class="label">Hours</div>
</div>

<div class="time-box">
<div class="number" id="minutes">0</div>
<div class="label">Minutes</div>
</div>

<div class="time-box">
<div class="number" id="seconds">0</div>
<div class="label">Seconds</div>
</div>

</div>

<div class="button-container">
<button class="nav-btn"
onclick="window.open('https://gadpayat.github.io/Status-Countdown/','_blank')">
👉 Click HERE to view the Individual SP Countdown
</button>
</div>

<div class="calculator-container">

<div class="calculator">

<input type="text" id="display" class="calc-display">

<div class="calc-buttons">

<button onclick="appendValue('Math.sin(')">sin</button>
<button onclick="appendValue('Math.cos(')">cos</button>
<button onclick="appendValue('Math.tan(')">tan</button>
<button onclick="appendValue('Math.sqrt(')">√</button>
<button onclick="clearDisplay()">C</button>

<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('/')">÷</button>
<button onclick="appendValue('(')">(</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('*')">×</button>
<button onclick="appendValue(')')">)</button>

<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('-')">−</button>
<button onclick="appendValue('Math.PI')">π</button>

<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="appendValue('+')">+</button>
<button onclick="appendValue('Math.E')">e</button>

</div>

</div>

</div>

</div>

<footer>
© 2026 Ghilous. All Rights Reserved.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* COUNTDOWN */

const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance/(1000*60*60*24));
    const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
    const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
    const seconds = Math.floor((distance%(1000*60))/1000);

    document.getElementById("days").textContent=days;
    document.getElementById("hours").textContent=hours;
    document.getElementById("minutes").textContent=minutes;
    document.getElementById("seconds").textContent=seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

/* CALCULATOR */

function appendValue(value){
    document.getElementById("display").value += value;
}

function clearDisplay(){
    document.getElementById("display").value="";
}

function calculate(){
    try{
        document.getElementById("display").value =
        eval(document.getElementById("display").value);
    }
    catch{
        document.getElementById("display").value="Error";
    }
}

/* THREE JS */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
5000
);

const renderer = new THREE.WebGLRenderer({
canvas:document.getElementById("bg"),
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

camera.position.z = 150;

/* Stars */

const starGeometry = new THREE.BufferGeometry();
const starVertices=[];

for(let i=0;i<10000;i++){

    starVertices.push(
        (Math.random()-0.5)*4000,
        (Math.random()-0.5)*4000,
        (Math.random()-0.5)*4000
    );

}

starGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(starVertices,3)
);

const stars = new THREE.Points(
starGeometry,
new THREE.PointsMaterial({
color:0xffffff,
size:2
})
);

scene.add(stars);

/* Moon */

const moon = new THREE.Mesh(
new THREE.SphereGeometry(18,64,64),
new THREE.MeshStandardMaterial({
color:0xe6e6e6,
emissive:0x666666
})
);

moon.position.set(-180,100,-100);

scene.add(moon);

/* Sun */

const sun = new THREE.Mesh(
new THREE.SphereGeometry(12,64,64),
new THREE.MeshBasicMaterial({
color:0xffdd44
})
);

scene.add(sun);

/* Planets */

const planets=[];

function createPlanet(size,color,distance,speed){

    const planet=new THREE.Mesh(
        new THREE.SphereGeometry(size,32,32),
        new THREE.MeshStandardMaterial({
            color:color
        })
    );

    scene.add(planet);

    planets.push({
        mesh:planet,
        distance:distance,
        speed:speed,
        angle:Math.random()*Math.PI*2
    });
}

createPlanet(4,0x3399ff,40,0.01);
createPlanet(6,0xff5533,70,0.007);
createPlanet(5,0x44ff88,100,0.005);
createPlanet(8,0xffcc66,140,0.003);

/* Light */

const light = new THREE.PointLight(0xffffff,2);
scene.add(light);

/* Shooting Stars */

const shootingStars=[];

function createShootingStar(){

    const star=new THREE.Mesh(
        new THREE.SphereGeometry(0.8,8,8),
        new THREE.MeshBasicMaterial({
            color:0xffffff
        })
    );

    star.position.set(
        -400,
        Math.random()*300,
        Math.random()*200
    );

    scene.add(star);

    shootingStars.push(star);
}

setInterval(createShootingStar,2500);

/* Animation */

function animate(){

    requestAnimationFrame(animate);

    stars.rotation.y += 0.0002;

    planets.forEach(p=>{

        p.angle += p.speed;

        p.mesh.position.x =
        Math.cos(p.angle)*p.distance;

        p.mesh.position.z =
        Math.sin(p.angle)*p.distance;

    });

    shootingStars.forEach(star=>{

        star.position.x += 10;
        star.position.y -= 2;

    });

    moon.rotation.y += 0.001;

    camera.position.x =
    Math.sin(Date.now()*0.0001)*30;

    camera.lookAt(scene.position);

    renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

    camera.aspect =
    window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
    window.innerWidth,
    window.innerHeight
    );

});

</script>

</body>
</html>
