<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:white;
}

/* 3D Background Canvas */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* UI Container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:9999;
    padding:10px;
}

h1{
    margin:0 0 10px 0;
    font-size:1.5rem;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

/* Countdown */
#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
}

.time-box{
    background:rgba(34,34,34,0.6);
    padding:12px;
    border-radius:10px;
    min-width:90px;
    border:1px solid rgba(255,255,255,0.2);
}

.number{
    font-size:2rem;
    font-weight:bold;
}

.label{
    font-size:0.8rem;
    color:#ccc;
    text-transform:uppercase;
}

/* Button */
.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px red;
}

/* Calculator */
.calculator{
    margin-top:30px;
    width:380px;
    margin-left:auto;
    margin-right:auto;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.2);
}

#calcDisplay{
    width:100%;
    height:55px;
    font-size:20px;
    text-align:right;
    background:black;
    color:#00ff00;
    border:none;
    margin-bottom:10px;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-buttons button{
    height:50px;
    background:#222;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* Footer */
footer{
    position:fixed;
    bottom:5px;
    width:100%;
    text-align:center;
    font-size:10px;
    color:white;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

    <h1>Sub-Project Completion Countdown for KKB-CDD</h1>

    <div id="countdown">
        <div class="time-box"><div class="number" id="days">0</div><div class="label">Days</div></div>
        <div class="time-box"><div class="number" id="hours">0</div><div class="label">Hours</div></div>
        <div class="time-box"><div class="number" id="minutes">0</div><div class="label">Minutes</div></div>
        <div class="time-box"><div class="number" id="seconds">0</div><div class="label">Seconds</div></div>
    </div>

    <div class="button-container">
        <button class="nav-btn"
            onclick="window.location.href='https://gadpayat.github.io/Status-Countdown/';">
            👉 Click HERE to view Individual SP Countdown
        </button>
    </div>

    <div class="calculator">

        <input type="text" id="calcDisplay" readonly>

        <div class="calc-buttons">
            <button onclick="appendCalc('(')">(</button>
            <button onclick="appendCalc(')')">)</button>
            <button onclick="appendCalc('**')">xʸ</button>
            <button onclick="clearCalc()">C</button>

            <button onclick="appendCalc('Math.sin(')">sin</button>
            <button onclick="appendCalc('Math.cos(')">cos</button>
            <button onclick="appendCalc('Math.tan(')">tan</button>
            <button onclick="appendCalc('/')">÷</button>

            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('*')">×</button>

            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('-')">−</button>

            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="appendCalc('+')">+</button>

            <button onclick="appendCalc('0')">0</button>
            <button onclick="appendCalc('.')">.</button>
            <button onclick="appendCalc('Math.PI')">π</button>
            <button onclick="calculateResult()">=</button>
        </div>

    </div>

</div>

<footer>© 2026 Ghilous. All Rights Reserved.</footer>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ===== COUNTDOWN =====
const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){
    const now = Date.now();
    const diff = targetDate - now;

    if(diff <= 0){
        document.getElementById("countdown").innerHTML = "<h2>Completed</h2>";
        return;
    }

    document.getElementById("days").textContent = Math.floor(diff/86400000);
    document.getElementById("hours").textContent = Math.floor((diff%86400000)/3600000);
    document.getElementById("minutes").textContent = Math.floor((diff%3600000)/60000);
    document.getElementById("seconds").textContent = Math.floor((diff%60000)/1000);
}
setInterval(updateCountdown,1000);
updateCountdown();

// ===== CALCULATOR =====
function appendCalc(v){document.getElementById("calcDisplay").value+=v;}
function clearCalc(){document.getElementById("calcDisplay").value="";}
function calculateResult(){
    try{
        document.getElementById("calcDisplay").value =
        eval(document.getElementById("calcDisplay").value);
    }catch(e){
        document.getElementById("calcDisplay").value="Error";
    }
}

// ===== 3D EARTH BACKGROUND =====
const canvas = document.getElementById("bg");
const renderer = new THREE.WebGLRenderer({canvas, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);
camera.position.z = 3;

scene.add(camera);

// Earth
const geometry = new THREE.SphereGeometry(1,64,64);

const texture = new THREE.TextureLoader().load(
"https://threejs.org/examples/textures/land_ocean_ice_lights_2048.jpg"
);

const material = new THREE.MeshStandardMaterial({
    map: texture
});

const earth = new THREE.Mesh(geometry, material);
scene.add(earth);

// Lights
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(5,3,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222222));

// Stars
function addStars(){
    const starGeo = new THREE.BufferGeometry();
    const starCount = 6000;
    const pos = [];

    for(let i=0;i<starCount;i++){
        pos.push((Math.random()-0.5)*200);
        pos.push((Math.random()-0.5)*200);
        pos.push((Math.random()-0.5)*200);
    }

    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));

    const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.7});
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
}
addStars();

// Animation
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y += 0.0015;

    camera.position.z += 0.0005; // slow zoom-out cinematic feel

    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
