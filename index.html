<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKB-CDD Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
color:white;
background:radial-gradient(circle at center,#1a0000 0%,#000 70%);
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:-50%;left:-50%;
width:200%;height:200%;
background:conic-gradient(from 0deg,rgba(255,0,0,.15),rgba(0,0,0,.8),rgba(255,0,0,.1),rgba(0,0,0,.9));
animation:spin 6s linear infinite;
filter:blur(40px);
z-index:-2;
}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.container{max-width:1200px;margin:auto;padding:20px;text-align:center}

#countdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.time-box{background:#200;padding:15px;border-radius:10px;min-width:100px}

.number{font-size:2rem;font-weight:bold}

/* GOLD BUTTON */
.nav-btn{
position:relative;
overflow:hidden;
background:linear-gradient(
135deg,
#fff7b2 0%,
#ffd700 15%,
#ffec8b 30%,
#d4af37 45%,
#fff4a3 60%,
#cfae2b 75%,
#ffe066 90%,
#fff7b2 100%
);
color:#000;
font-weight:bold;
font-size:20px;
padding:18px 32px;
min-width:280px;
letter-spacing:0.5px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:15px;
box-shadow:
0 0 10px rgba(255,215,0,.8),
0 0 20px rgba(255,215,0,.6),
0 0 35px rgba(255,215,0,.4),
inset 0 2px 3px rgba(255,255,255,.8);
animation:goldGlow 2s ease-in-out infinite;
transition:.3s;
}

.nav-btn:hover{
transform:scale(1.05);
box-shadow:
0 0 15px rgba(255,215,0,1),
0 0 30px rgba(255,215,0,.8),
0 0 50px rgba(255,215,0,.6);
}

.nav-btn::before{
content:"";
position:absolute;
top:-50%;
left:-150%;
width:60%;
height:200%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
transform:rotate(25deg);
animation:goldShine 2.5s linear infinite;
}

.nav-btn::after{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 0%, transparent 8%),
radial-gradient(circle at 70% 20%, rgba(255,255,255,.8) 0%, transparent 6%),
radial-gradient(circle at 85% 70%, rgba(255,255,255,.9) 0%, transparent 7%),
radial-gradient(circle at 35% 80%, rgba(255,255,255,.8) 0%, transparent 5%);
pointer-events:none;
animation:sparkle 1.8s infinite alternate;
}

@keyframes goldShine{0%{left:-150%}100%{left:180%}}
@keyframes goldGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes sparkle{0%{opacity:.3}100%{opacity:1}}

/* SIDE-BY-SIDE */
.tools-container{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:30px;
margin-top:30px;
flex-wrap:nowrap;
}

.panel{
flex:1;
min-width:0;
background:rgba(20,0,0,.92);
padding:20px;
border-radius:16px;
border:1px solid rgba(255,215,0,.25);
box-shadow:
0 0 20px rgba(255,215,0,.15),
inset 0 0 20px rgba(255,255,255,.03);
backdrop-filter:blur(10px);
}

/* CALCULATOR DISPLAY */
#calcDisplay{
width:100%;
height:65px;
margin-bottom:12px;
box-sizing:border-box;
background:#000;
color:#00ff00;
border:none;
border-radius:10px;
padding:10px 15px;
font-family:'Courier New',monospace;
font-size:32px;
font-weight:bold;
text-align:right;
box-shadow:
inset 0 0 15px rgba(0,255,0,.3),
0 0 10px rgba(0,255,0,.2);
}

/* INPUTS */
#unitInput{
width:100%;
height:55px;
margin-bottom:10px;
box-sizing:border-box;
background:#000;
color:#fff;
border:none;
border-radius:10px;
padding:10px;
font-size:24px;
font-weight:bold;
text-align:center;
}

/* DROPDOWNS */
#category,
#fromUnit,
#toUnit{
width:100%;
height:55px;
margin-bottom:10px;
box-sizing:border-box;
background:#000;
color:#ffb3b3;
border:none;
border-radius:10px;
padding:10px;
font-size:20px;
font-weight:bold;
}

/* RESULT (GOLD GLOW) */
#unitResult{
width:100%;
height:65px;
margin-bottom:10px;
margin-top:15px;
box-sizing:border-box;
background:linear-gradient(135deg,#1a1200,#2d1b00,#1a1200);
color:#ffd700;
border:2px solid rgba(255,215,0,.4);
border-radius:12px;
padding:10px;
font-family:'Courier New',monospace;
font-size:25px;
font-weight:bold;
text-align:center;
animation:goldPulse 2s infinite;
}

/* BUTTON GRID */
.calc-buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

/* DEFAULT BUTTON */
button{
background:linear-gradient(
180deg,
rgba(255,255,255,.25) 0%,
rgba(130,3,3,.95) 50%,
rgba(70,0,0,.95) 100%
);

color:white;
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
cursor:pointer;
padding:12px;

font-weight:bold;

box-shadow:
0 8px 15px rgba(0,0,0,.4),
inset 0 2px 3px rgba(255,255,255,.3),
inset 0 -3px 6px rgba(0,0,0,.5);

transition:.2s ease;
position:relative;
overflow:hidden;
}

/* shine effect */
button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
transform:skewX(-25deg);
transition:.6s;
}

button:hover::before{
left:140%;
}

button:hover{
transform:translateY(-2px);
box-shadow:
0 12px 25px rgba(0,0,0,.5),
0 0 15px rgba(255,0,0,.4);
}

button:active{
transform:translateY(3px);
box-shadow:
0 3px 8px rgba(0,0,0,.6);
}

/* 3D GLASS BUTTONS */
.calc-buttons button{
height:58px;
font-size:18px;
font-weight:bold;
color:#fff;

background:linear-gradient(
180deg,
rgba(255,255,255,.35) 0%,
rgba(180,0,0,.85) 45%,
rgba(90,0,0,.95) 100%
);

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 8px 15px rgba(0,0,0,.45),
inset 0 2px 3px rgba(255,255,255,.35),
inset 0 -2px 4px rgba(0,0,0,.4);

position:relative;
overflow:hidden;
transition:all .2s ease;
}

/* SHINE EFFECT */
.calc-buttons button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
transform:skewX(-25deg);
transition:.6s;
}

.calc-buttons button:hover::before{
left:150%;
}

.calc-buttons button:hover{
transform:translateY(-2px);
box-shadow:
0 12px 25px rgba(255,0,0,.5),
0 0 15px rgba(255,0,0,.5),
inset 0 2px 3px rgba(255,255,255,.4);
}

.calc-buttons button:active{
transform:translateY(3px);
box-shadow:
0 2px 5px rgba(0,0,0,.5),
inset 0 2px 6px rgba(0,0,0,.6);
}

footer{
text-align:center;
padding:15px;
font-size:12px;
color:#ff9999;
}

@media(max-width:1100px){
.tools-container{
flex-direction:column;
align-items:center;
}
.panel{
width:95%;
}
}

/* GOLD ANIMATION */
@keyframes goldPulse{
0%{
box-shadow:
0 0 5px rgba(255,215,0,.4),
0 0 10px rgba(255,215,0,.3),
inset 0 0 5px rgba(255,215,0,.2);
}
50%{
box-shadow:
0 0 15px rgba(255,215,0,.8),
0 0 30px rgba(255,215,0,.7),
0 0 50px rgba(255,215,0,.5),
inset 0 0 15px rgba(255,215,0,.4);
}
100%{
box-shadow:
0 0 5px rgba(255,215,0,.4),
0 0 10px rgba(255,215,0,.3),
inset 0 0 5px rgba(255,215,0,.2);
}
}
</style>
</head>

<body>

<div class="container">

<h1>SP Completion Countdown for KKB-CDD</h1>

<div id="countdown">
<div class="time-box"><div class="number" id="days">0</div><div>Days</div></div>
<div class="time-box"><div class="number" id="hours">0</div><div>Hours</div></div>
<div class="time-box"><div class="number" id="minutes">0</div><div>Minutes</div></div>
<div class="time-box"><div class="number" id="seconds">0</div><div>Seconds</div></div>
</div>

<p>
<button class="nav-btn"
onclick="window.location.href='https://gadpayat.github.io/Status-Countdown-with-PA/'">
View Individual SP Countdown
</button>
</p>

<div class="tools-container">

<!-- CALCULATOR -->
<div class="panel">
<h2>Scientific Calculator</h2>
<input id="calcDisplay" readonly>

<div class="calc-buttons">
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>
<button onclick="add('**')">xʸ</button>
<button onclick="clr()">C</button>

<button onclick="add('Math.sin(')">sin</button>
<button onclick="add('Math.cos(')">cos</button>
<button onclick="add('Math.tan(')">tan</button>
<button onclick="add('/')">÷</button>

<button onclick="add('Math.log10(')">log</button>
<button onclick="add('Math.sqrt(')">√</button>
<button onclick="add('*')">×</button>
<button onclick="add('-')">−</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('+')">+</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="eq()">=</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="bk()">⌫</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('Math.PI')">π</button>
<button onclick="add('Math.E')">e</button>
</div>
</div>

<!-- CONVERTER -->
<div class="panel">
<h2>Universal Unit Converter</h2>

<select id="category" onchange="populateUnits()">
<option value="length">Length</option>
<option value="area">Area</option>
<option value="volume">Volume</option>
<option value="mass">Mass / Weight</option>
<option value="temperature">Temperature</option>
<option value="speed">Speed</option>
<option value="time">Time</option>
<option value="pressure">Pressure</option>
<option value="energy">Energy</option>
<option value="power">Power</option>
<option value="storage">Data Storage</option>
<option value="angle">Angle</option>
</select>

<input type="number" id="unitInput" placeholder="Enter Value">

<select id="fromUnit"></select>
<select id="toUnit"></select>

<button onclick="convertUnit()">Convert</button>

  
<input type="text" id="unitResult" readonly placeholder="Result">
</div>

</div>

<footer>© 2026 Ghilous. All Rights Reserved.</footer>

<script>
const targetDate=new Date("October 31, 2026 00:00:00").getTime();

setInterval(()=>{
let d=targetDate-Date.now();
if(d<0)return;
days.textContent=Math.floor(d/86400000);
hours.textContent=Math.floor((d%86400000)/3600000);
minutes.textContent=Math.floor((d%3600000)/60000);
seconds.textContent=Math.floor((d%60000)/1000);
},1000);

function add(v){calcDisplay.value+=v;}
function clr(){calcDisplay.value='';}
function bk(){calcDisplay.value=calcDisplay.value.slice(0,-1);}
function eq(){try{calcDisplay.value=eval(calcDisplay.value);}catch(e){calcDisplay.value='Error';}}

const unitData = {
length:{mm:0.001,cm:0.01,m:1,km:1000,in:0.0254,ft:0.3048,yd:0.9144,mi:1609.344,nmi:1852},
area:{"mm²":0.000001,"cm²":0.0001,"m²":1,"km²":1000000,"ft²":0.092903,"yd²":0.836127,acre:4046.856,hectare:10000},
volume:{mL:0.001,L:1,m3:1000,tsp:0.00492892,tbsp:0.0147868,cup:0.236588,pint:0.473176,quart:0.946353,gallon:3.78541},
mass:{mg:0.000001,g:0.001,kg:1,ton:1000,oz:0.0283495,lb:0.453592,stone:6.35029},
speed:{"m/s":1,"km/h":0.277778,mph:0.44704,knot:0.514444},
time:{ms:0.001,sec:1,min:60,hr:3600,day:86400,week:604800,month:2629800,year:31557600},
pressure:{Pa:1,kPa:1000,MPa:1000000,bar:100000,psi:6894.76,atm:101325},
energy:{J:1,kJ:1000,cal:4.184,kcal:4184,Wh:3600,kWh:3600000},
power:{W:1,kW:1000,MW:1000000,hp:745.7},
storage:{bit:0.125,byte:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776},
angle:{degree:1,radian:57.2958}
};

function populateUnits(){
const category=document.getElementById("category").value;
const from=document.getElementById("fromUnit");
const to=document.getElementById("toUnit");

from.innerHTML="";
to.innerHTML="";

Object.keys(unitData[category]).forEach(unit=>{
let opt1=document.createElement("option");
opt1.value=unit;
opt1.textContent=unit;
from.appendChild(opt1);

let opt2=document.createElement("option");
opt2.value=unit;
opt2.textContent=unit;
to.appendChild(opt2);
});
}

function convertUnit(){
const category=document.getElementById("category").value;
const value=parseFloat(document.getElementById("unitInput").value);

if(isNaN(value)){
document.getElementById("unitResult").value="Enter a number";
return;
}

if(category==="temperature"){
const from=document.getElementById("fromUnit").value;
const to=document.getElementById("toUnit").value;

let result=value;

if(from==="C"&&to==="F") result=(value*9/5)+32;
else if(from==="F"&&to==="C") result=(value-32)*5/9;
else if(from==="C"&&to==="K") result=value+273.15;
else if(from==="K"&&to==="C") result=value-273.15;
else if(from==="F"&&to==="K") result=(value-32)*5/9+273.15;
else if(from==="K"&&to==="F") result=(value-273.15)*9/5+32;

document.getElementById("unitResult").value=result;
return;
}

const from=document.getElementById("fromUnit").value;
const to=document.getElementById("toUnit").value;

const base=value*unitData[category][from];
const result=base/unitData[category][to];

document.getElementById("unitResult").value=result.toLocaleString(undefined,{
maximumFractionDigits:10
});
}

unitData.temperature={C:1,F:1,K:1};

populateUnits();
</script>

</body>
</html>
