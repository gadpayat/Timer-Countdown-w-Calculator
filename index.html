<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
}

/* 3D Background */
#space-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-10;
}

/* Main Container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:1000;
    padding:10px;
}

h1{
    margin-bottom:10px;
    font-size:1.8rem;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(30,30,30,.85);
    padding:15px;
    border-radius:12px;
    min-width:110px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 20px rgba(255,255,255,.15);
    backdrop-filter:blur(5px);
}

.number{
    font-size:2.2rem;
    font-weight:bold;
}

.label{
    color:#ccc;
    margin-top:5px;
    font-size:.85rem;
    text-transform:uppercase;
}

.button-container{
    margin-top:20px;
}

.nav-btn{
    background:#ff0000;
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 20px red;
    transition:.3s;
}

.nav-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px red;
}

/* Calculator */
.calculator{
    margin-top:40px;
    width:400px;
    background:rgba(20,20,20,.9);
    border-radius:15px;
    padding:15px;
    margin-left:auto;
    margin-right:auto;
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
}

#calcDisplay{
    width:100%;
    height:60px;
    background:#000;
    color:#00ff66;
    border:none;
    border-radius:10px;
    font-size:22px;
    padding:10px;
    text-align:right;
    margin-bottom:10px;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-buttons button{
    height:55px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

.calc-buttons button:hover{
    background:#555;
    transform:scale(1.05);
}

footer{
    position:fixed;
    bottom:8px;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:11px;
    letter-spacing:1px;
    z-index:1000;
}
</style>
</head>
<body>

<div id="space-bg"></div>

<div class="container">

    <h1>Sub-Project Completion Countdown for KKB-CDD</h1>

    <div id="countdown">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="button-container">
        <button class="nav-btn"
        onclick="window.open('YOUR_SP_LINK_HERE','_blank')">
            👉 Click HERE to view the Individual SP Countdown
        </button>
    </div>

    <div class="calculator">

        <input type="text" id="calcDisplay" readonly>

        <div class="calc-buttons">

            <button onclick="appendCalc('(')">(</button>
            <button onclick="appendCalc(')')">)</button>
            <button onclick="appendCalc('**')">xʸ</button>
            <button onclick="clearCalc()">C</button>

            <button onclick="appendCalc('Math.sin(')">sin</button>
            <button onclick="appendCalc('Math.cos(')">cos</button>
            <button onclick="appendCalc('Math.tan(')">tan</button>
            <button onclick="appendCalc('/')">÷</button>

            <button onclick="appendCalc('Math.log10(')">log</button>
            <button onclick="appendCalc('Math.log(')">ln</button>
            <button onclick="appendCalc('Math.sqrt(')">√</button>
            <button onclick="appendCalc('*')">×</button>

            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('-')">−</button>

            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('+')">+</button>

            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="calculateResult()">=</button>

            <button onclick="appendCalc('0')">0</button>
            <button onclick="appendCalc('.')">.</button>
            <button onclick="appendCalc('Math.PI')">π</button>
            <button onclick="backspaceCalc()">⌫</button>

        </div>

    </div>

</div>

<footer>
© 2026 Ghilous. All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* COUNTDOWN */

const targetDate =
new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance < 0) return;

    document.getElementById("days").innerHTML =
    Math.floor(distance/(1000*60*60*24));

    document.getElementById("hours").innerHTML =
    Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    document.getElementById("minutes").innerHTML =
    Math.floor((distance%(1000*60*60))/(1000*60));

    document.getElementById("seconds").innerHTML =
    Math.floor((distance%(1000*60))/1000);
}

setInterval(updateCountdown,1000);
updateCountdown();

/* CALCULATOR */

function appendCalc(v){
document.getElementById("calcDisplay").value+=v;
}

function clearCalc(){
document.getElementById("calcDisplay").value="";
}

function backspaceCalc(){
let d=document.getElementById("calcDisplay");
d.value=d.value.slice(0,-1);
}

function calculateResult(){
try{
document.getElementById("calcDisplay").value=
eval(document.getElementById("calcDisplay").value);
}catch{
document.getElementById("calcDisplay").value="Error";
}
}

/* THREE.JS SPACE */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
1,
5000
);

camera.position.z=1000;

const renderer=new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.getElementById('space-bg')
.appendChild(renderer.domElement);

/* STARS */

const starsGeometry=new THREE.BufferGeometry();
const starVertices=[];

for(let i=0;i<10000;i++){

starVertices.push(
(Math.random()-0.5)*5000,
(Math.random()-0.5)*5000,
(Math.random()-0.5)*5000
);

}

starsGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(
starVertices,3
)
);

const starsMaterial=
new THREE.PointsMaterial({
color:0xffffff,
size:2
});

const stars=
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* MOON */

const moon=
new THREE.Mesh(
new THREE.SphereGeometry(120,64,64),
new THREE.MeshPhongMaterial({
color:0xffffff
})
);

moon.position.set(-1200,500,-800);
scene.add(moon);

/* PLANETS */

const planet1=
new THREE.Mesh(
new THREE.SphereGeometry(80,64,64),
new THREE.MeshPhongMaterial({
color:0x3366ff
})
);

scene.add(planet1);

const planet2=
new THREE.Mesh(
new THREE.SphereGeometry(60,64,64),
new THREE.MeshPhongMaterial({
color:0xff8844
})
);

planet2.position.set(900,-200,-700);
scene.add(planet2);

/* LIGHTS */

scene.add(
new THREE.AmbientLight(
0xffffff,
0.8
)
);

const pointLight=
new THREE.PointLight(
0xffffff,
2
);

pointLight.position.set(
100,
100,
500
);

scene.add(pointLight);

/* SHOOTING STARS */

const shootingStars=[];

function createShootingStar(){

const star=
new THREE.Mesh(
new THREE.SphereGeometry(3),
new THREE.MeshBasicMaterial({
color:0xffffff
})
);

star.position.set(
1500,
Math.random()*800,
-300
);

star.velocity={
x:-25,
y:-10
};

scene.add(star);
shootingStars.push(star);
}

setInterval(createShootingStar,3000);

/* ANIMATE */

function animate(){

requestAnimationFrame(animate);

stars.rotation.y+=0.00015;

planet1.position.x=
700*Math.cos(
Date.now()*0.00015
);

planet1.position.z=
700*Math.sin(
Date.now()*0.00015
);

planet1.rotation.y+=0.01;
planet2.rotation.y+=0.008;
moon.rotation.y+=0.002;

shootingStars.forEach((s,i)=>{

s.position.x+=s.velocity.x;
s.position.y+=s.velocity.y;

if(s.position.x<-2000){

scene.remove(s);
shootingStars.splice(i,1);

}

});

camera.position.x=
Math.sin(Date.now()*0.0001)*50;

camera.position.y=
Math.cos(Date.now()*0.0001)*30;

camera.lookAt(scene.position);

renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

camera.aspect=
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});
</script>

</body>
</html>
