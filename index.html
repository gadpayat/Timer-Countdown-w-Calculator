<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
body{
    margin:0;
    overflow:hidden;
    color:white;
    font-family:Arial, sans-serif;
    background:#000;
}

/* THREE.JS BACKGROUND CANVAS */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
}

/* soft space glow overlay */
.space-glow{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    background: radial-gradient(circle at center,
        rgba(0,20,40,0.3),
        rgba(0,0,0,0.9)
    );
}

/* Top-center container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:9999;
    padding:10px;
}

h1{
    margin:0 0 10px 0;
    font-size:1.5rem;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(34,34,34,0.75);
    padding:12px;
    border-radius:10px;
    min-width:90px;
    box-shadow:0 0 10px rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
}

.number{
    font-size:2rem;
    font-weight:bold;
    line-height:1;
}

.label{
    font-size:0.8rem;
    margin-top:5px;
    color:#ccc;
    text-transform:uppercase;
}

/* Button */
.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px red;
    transition:all 0.3s ease;
}

.nav-btn:hover{
    background:#cc0000;
    transform:scale(1.05);
    box-shadow:0 0 20px red;
}

/* Calculator */
.calculator{
    margin-top:30px;
    width:380px;
    margin-left:auto;
    margin-right:auto;
    background:rgba(34,34,34,0.9);
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.15);
}

#calcDisplay{
    width:100%;
    height:55px;
    font-size:20px;
    text-align:right;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    background:#000;
    color:#00ff88;
    box-sizing:border-box;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-buttons button{
    height:50px;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.calc-buttons button:hover{
    background:#555;
    transform:scale(1.05);
}

/* Footer */
footer{
    position:fixed;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:10px;
    color:rgba(255,255,255,0.75);
    letter-spacing:1px;
    pointer-events:none;
}
</style>
</head>

<body>

<!-- 3D BACKGROUND -->
<canvas id="bg"></canvas>
<div class="space-glow"></div>

<div class="container">

    <h1>Sub-Project Completion Countdown for KKB-CDD</h1>

    <div id="countdown">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="button-container">
        <button class="nav-btn"
            onclick="window.location.href='https://gadpayat.github.io/Status-Countdown/';">
            👉 Click HERE to view the Individual SP Countdown
        </button>
    </div>

    <div class="calculator">

        <input type="text" id="calcDisplay" readonly>

        <div class="calc-buttons">
            <button onclick="appendCalc('(')">(</button>
            <button onclick="appendCalc(')')">)</button>
            <button onclick="appendCalc('**')">xʸ</button>
            <button onclick="clearCalc()">C</button>

            <button onclick="appendCalc('Math.sin(')">sin</button>
            <button onclick="appendCalc('Math.cos(')">cos</button>
            <button onclick="appendCalc('Math.tan(')">tan</button>
            <button onclick="appendCalc('/')">÷</button>

            <button onclick="appendCalc('Math.log10(')">log</button>
            <button onclick="appendCalc('Math.log(')">ln</button>
            <button onclick="appendCalc('Math.sqrt(')">√</button>
            <button onclick="appendCalc('*')">×</button>

            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('-')">−</button>

            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('+')">+</button>

            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="calculateResult()">=</button>

            <button onclick="appendCalc('0')">0</button>
            <button onclick="appendCalc('.')">.</button>
            <button onclick="appendCalc('Math.PI')">π</button>
            <button onclick="backspaceCalc()">⌫</button>
        </div>

    </div>

</div>

<footer>
    © 2026 Ghilous. All Rights Reserved.
</footer>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
/* ================= COUNTDOWN ================= */
const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("countdown").innerHTML =
        "<h2>🎉 The countdown has ended!</h2>";
        return;
    }

    document.getElementById("days").textContent = Math.floor(distance/(1000*60*60*24));
    document.getElementById("hours").textContent = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
    document.getElementById("minutes").textContent = Math.floor((distance%(1000*60*60))/(1000*60));
    document.getElementById("seconds").textContent = Math.floor((distance%(1000*60))/1000);
}
setInterval(updateCountdown,1000);
updateCountdown();

/* ================= CALCULATOR ================= */
function appendCalc(v){ document.getElementById("calcDisplay").value += v; }
function clearCalc(){ document.getElementById("calcDisplay").value = ""; }
function backspaceCalc(){
    let d = document.getElementById("calcDisplay");
    d.value = d.value.slice(0,-1);
}
function calculateResult(){
    try{
        document.getElementById("calcDisplay").value =
        eval(document.getElementById("calcDisplay").value);
    }catch(e){
        document.getElementById("calcDisplay").value = "Error";
    }
}

/* ================= 3D EARTH BACKGROUND ================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg"),
    antialias:true
});
renderer.setSize(window.innerWidth, window.innerHeight);

/* Earth */
const geometry = new THREE.SphereGeometry(2, 64, 64);

const loader = new THREE.TextureLoader();
const earthTexture = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
const earthLights = loader.load("https://threejs.org/examples/textures/planets/earth_lights_2048.png");

const material = new THREE.MeshStandardMaterial({
    map: earthTexture,
    emissiveMap: earthLights,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 1
});

const earth = new THREE.Mesh(geometry, material);
scene.add(earth);

/* Lights */
const light = new THREE.PointLight(0xffffff, 1.2);
light.position.set(5,3,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222222));

camera.position.z = 6;

/* Stars */
function addStars(){
    const starGeo = new THREE.BufferGeometry();
    const starCount = 6000;
    const positions = [];

    for(let i=0;i<starCount;i++){
        positions.push((Math.random()-0.5)*200);
        positions.push((Math.random()-0.5)*200);
        positions.push((Math.random()-0.5)*200);
    }

    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));

    const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.5});
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
}
addStars();

/* Animation */
function animate(){
    requestAnimationFrame(animate);
    earth.rotation.y += 0.002;
    renderer.render(scene, camera);
}
animate();

/* Resize */
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
