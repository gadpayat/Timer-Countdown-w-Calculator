<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;

    /* Base “time running out” atmosphere */
    background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
}

/* ===== RUNNING OUT OF TIME BACKGROUND EFFECT ===== */

/* rotating “clock pulse” layer */
body::before{
    content:"";
    position:fixed;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background: conic-gradient(
        from 0deg,
        rgba(255,0,0,0.15),
        rgba(0,0,0,0.8),
        rgba(255,0,0,0.1),
        rgba(0,0,0,0.9),
        rgba(255,0,0,0.2)
    );
    animation: spin 6s linear infinite;
    z-index:-2;
    opacity:0.8;
    filter: blur(40px);
}

/* flickering urgency overlay */
body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 50% 50%, rgba(255,0,0,0.15), transparent 60%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,0,0,0.05) 0 2px, transparent 2px 6px);
    animation: pulse 1.5s infinite alternate;
    z-index:-1;
    opacity:0.6;
}

/* spinning motion */
@keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

/* heartbeat / ticking effect */
@keyframes pulse{
    0%{ opacity:0.3; filter:contrast(1); }
    100%{ opacity:0.7; filter:contrast(1.4); }
}

/* Top-center container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:9999;
    padding:10px;
}

h1{
    margin:0 0 10px 0;
    font-size:1.5rem;
    text-shadow:0 0 10px rgba(255,0,0,0.4);
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(20,0,0,0.85);
    padding:12px;
    border-radius:10px;
    min-width:90px;
    box-shadow:0 0 15px rgba(255,0,0,0.25);
    border:1px solid rgba(255,0,0,0.2);
}

.number{
    font-size:2rem;
    font-weight:bold;
    line-height:1;
}

.label{
    font-size:0.8rem;
    margin-top:5px;
    color:#ffaaaa;
    text-transform:uppercase;
}

/* Button below timer */
.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#b00000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 15px red;
    transition:all 0.3s ease;
}

.nav-btn:hover{
    background:#ff0000;
    transform:scale(1.05);
    box-shadow:0 0 25px red;
}

/* Scientific Calculator */
.calculator{
    margin-top:30px;
    width:380px;
    margin-left:auto;
    margin-right:auto;
    background:rgba(20,0,0,0.9);
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,0,0,0.2);
    border:1px solid rgba(255,0,0,0.25);
}

#calcDisplay{
    width:100%;
    height:55px;
    font-size:20px;
    text-align:right;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    background:#000;
    color:#ff4444;
    box-sizing:border-box;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-buttons button{
    height:50px;
    border:none;
    border-radius:8px;
    background:#2a0000;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.calc-buttons button:hover{
    background:#5a0000;
    transform:scale(1.05);
}

/* Footer Signature */
footer{
    position:fixed;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:10px;
    color:rgba(255,150,150,0.7);
    letter-spacing:1px;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>SP Completion Countdown for KKB-CDD</h1>

    <div id="countdown">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="button-container">
        <button class="nav-btn"
            onclick="window.location.href='https://gadpayat.github.io/Status-Countdown/';">
            👉 Click HERE to view the Individual SP Countdown
        </button>
    </div>

    <div class="calculator">

        <input type="text" id="calcDisplay" readonly>

        <div class="calc-buttons">

            <button onclick="appendCalc('(')">(</button>
            <button onclick="appendCalc(')')">)</button>
            <button onclick="appendCalc('**')">xʸ</button>
            <button onclick="clearCalc()">C</button>

            <button onclick="appendCalc('Math.sin(')">sin</button>
            <button onclick="appendCalc('Math.cos(')">cos</button>
            <button onclick="appendCalc('Math.tan(')">tan</button>
            <button onclick="appendCalc('/')">÷</button>

            <button onclick="appendCalc('Math.log10(')">log</button>
            <button onclick="appendCalc('Math.log(')">ln</button>
            <button onclick="appendCalc('Math.sqrt(')">√</button>
            <button onclick="appendCalc('*')">×</button>

            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('-')">−</button>

            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('+')">+</button>

            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="calculateResult()">=</button>

            <button onclick="appendCalc('0')">0</button>
            <button onclick="appendCalc('.')">.</button>
            <button onclick="appendCalc('Math.PI')">π</button>
            <button onclick="backspaceCalc()">⌫</button>

        </div>

    </div>

</div>

<script>
const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("countdown").innerHTML =
        "<h2>Time has run out.</h2>";
        return;
    }

    const days = Math.floor(distance/(1000*60*60*24));
    const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
    const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
    const seconds = Math.floor((distance%(1000*60))/1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

/* Calculator */
function appendCalc(v){ document.getElementById("calcDisplay").value += v; }
function clearCalc(){ document.getElementById("calcDisplay").value = ""; }
function backspaceCalc(){
    let d=document.getElementById("calcDisplay");
    d.value=d.value.slice(0,-1);
}
function calculateResult(){
    try{
        document.getElementById("calcDisplay").value =
        eval(document.getElementById("calcDisplay").value);
    }catch(e){
        document.getElementById("calcDisplay").value="Error";
    }
}
</script>

<footer>
    © 2026 Ghilous. All Rights Reserved.
</footer>

</body>
</html>
