<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

/* Top-center container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:9999;
    padding:10px;
}

h1{
    margin:0 0 10px 0;
    font-size:1.5rem;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(34,34,34,0.9);
    padding:12px;
    border-radius:10px;
    min-width:90px;
    box-shadow:0 0 10px rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.1);
}

.number{
    font-size:2rem;
    font-weight:bold;
    line-height:1;
}

.label{
    font-size:0.8rem;
    margin-top:5px;
    color:#ccc;
    text-transform:uppercase;
}

/* Button below timer */
.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px red;
    transition:all 0.3s ease;
}

.nav-btn:hover{
    background:#cc0000;
    transform:scale(1.05);
    box-shadow:0 0 20px red;
}

/* Scientific Calculator */
.calculator{
    margin-top:30px; /* Double-spaced below button */
    width:380px;
    margin-left:auto;
    margin-right:auto;
    background:rgba(34,34,34,0.95);
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.15);
}

#calcDisplay{
    width:100%;
    height:55px;
    font-size:20px;
    text-align:right;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    background:#000;
    color:#00ff00;
    box-sizing:border-box;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-buttons button{
    height:50px;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.calc-buttons button:hover{
    background:#555;
    transform:scale(1.05);
}

/* Footer Signature */
footer{
    position:fixed;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:10px;
    color:rgba(255,255,255,0.75);
    letter-spacing:1px;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>Sub-Project Completion Countdown for KKB-CDD</h1>

    <div id="countdown">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <!-- Button -->
    <div class="button-container">
        <button class="nav-btn"
            onclick="window.location.href='https://gadpayat.github.io/Status-Countdown/';">
            👉 Click HERE to view the Individual SP Countdown
        </button>
    </div>

    <!-- Scientific Calculator -->
    <div class="calculator">

        <input type="text" id="calcDisplay" readonly>

        <div class="calc-buttons">

            <button onclick="appendCalc('(')">(</button>
            <button onclick="appendCalc(')')">)</button>
            <button onclick="appendCalc('**')">xʸ</button>
            <button onclick="clearCalc()">C</button>

            <button onclick="appendCalc('Math.sin(')">sin</button>
            <button onclick="appendCalc('Math.cos(')">cos</button>
            <button onclick="appendCalc('Math.tan(')">tan</button>
            <button onclick="appendCalc('/')">÷</button>

            <button onclick="appendCalc('Math.log10(')">log</button>
            <button onclick="appendCalc('Math.log(')">ln</button>
            <button onclick="appendCalc('Math.sqrt(')">√</button>
            <button onclick="appendCalc('*')">×</button>

            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('-')">−</button>

            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('+')">+</button>

            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="calculateResult()">=</button>

            <button onclick="appendCalc('0')">0</button>
            <button onclick="appendCalc('.')">.</button>
            <button onclick="appendCalc('Math.PI')">π</button>
            <button onclick="backspaceCalc()">⌫</button>

        </div>

    </div>

</div>

<script>
const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("countdown").innerHTML =
        "<h2>🎉 The countdown has ended!</h2>";
        return;
    }

    const days = Math.floor(distance/(1000*60*60*24));

    const hours = Math.floor(
        (distance%(1000*60*60*24))
        /(1000*60*60)
    );

    const minutes = Math.floor(
        (distance%(1000*60*60))
        /(1000*60)
    );

    const seconds = Math.floor(
        (distance%(1000*60))
        /1000
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

/* Scientific Calculator */

function appendCalc(value){
    document.getElementById("calcDisplay").value += value;
}

function clearCalc(){
    document.getElementById("calcDisplay").value = "";
}

function backspaceCalc(){
    let display = document.getElementById("calcDisplay");
    display.value = display.value.slice(0,-1);
}

function calculateResult(){
    try{
        let result = eval(document.getElementById("calcDisplay").value);
        document.getElementById("calcDisplay").value = result;
    }
    catch(error){
        document.getElementById("calcDisplay").value = "Error";
    }
}
</script>

<footer>
    © 2026 Ghilous. All Rights Reserved.
</footer>

</body>
</html>
